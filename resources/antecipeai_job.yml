# Definição do Job "AntecipeAI - Pipeline ETL" publicado pelo Asset Bundle.
#
# Roda em compute SERVERLESS de propósito: o Databricks Free Edition só
# oferece serverless (sem cluster clássico) — por isso nenhuma task abaixo
# define job_clusters/new_cluster. Ao omitir o compute, o Databricks usa
# serverless automaticamente.
#
# ATENÇÃO — pipeline ainda não roda 100% desatendido de ponta a ponta:
#   1) a task "bootstrap_landing_convert_xlsx" depende de alguém ter subido
#      manualmente o LW-DATASET.xlsx no Volume antes (Catalog Explorer →
#      Upload) — não é acionado por este Job sozinho.
#   2) a ingestão do .xlsx em si ainda está pendente da decisão sobre
#      spark-excel vs. limitação do compute serverless (ver README, seção
#      "Desafios técnicos enfrentados").
# Isso não trava o deploy do bundle — só significa que "Run now" no Job só
# vai completar com sucesso depois desses dois pontos resolvidos.

resources:
  jobs:
    antecipeai_pipeline:
      name: "AntecipeAI - Pipeline ETL (Bronze -> Silver -> Gold)"

      tasks:
        - task_key: setup_catalog_schemas
          notebook_task:
            notebook_path: ../notebooks/01_setup_catalog_schemas.ipynb

        - task_key: bootstrap_landing_convert_xlsx
          depends_on:
            - task_key: setup_catalog_schemas
          notebook_task:
            notebook_path: ../notebooks/02_bootstrap_landing_convert_xlsx.ipynb

        - task_key: bronze_ingestion_autoloader
          depends_on:
            - task_key: bootstrap_landing_convert_xlsx
          notebook_task:
            notebook_path: ../notebooks/03_bronze_ingestion_autoloader.ipynb

        - task_key: exploratory_analysis
          depends_on:
            - task_key: bronze_ingestion_autoloader
          notebook_task:
            notebook_path: ../notebooks/04_exploratory_analysis.ipynb

        - task_key: silver_transform
          depends_on:
            - task_key: exploratory_analysis
          notebook_task:
            notebook_path: ../notebooks/05_silver_transform.ipynb

        - task_key: gold_datamart
          depends_on:
            - task_key: silver_transform
          notebook_task:
            notebook_path: ../notebooks/06_gold_datamart.ipynb