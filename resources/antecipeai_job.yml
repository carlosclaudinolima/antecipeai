# =============================================================================
# Configuração do projeto AntecipeAI - Enterprise Challenge FIAP x Locaweb
# =============================================================================
# Ajuste estes valores conforme o ambiente. O objetivo deste arquivo é permitir
# migrar o projeto do Databricks Free (tudo managed, dentro do próprio metastore)
# para um ambiente de nuvem (S3/AWS, ADLS/Azure, GCS/GCP, Object Storage/OCI)
# trocando SOMENTE estas variáveis — os notebooks não devem precisar de
# alteração de código para essa migração.

# --- Identificação do catalog/schemas no Unity Catalog ---
ANTECIPEAI_CATALOG=antecipeai
ANTECIPEAI_SCHEMA_LANDING=landing
ANTECIPEAI_SCHEMA_BRONZE=bronze
ANTECIPEAI_SCHEMA_SILVER=silver
ANTECIPEAI_SCHEMA_GOLD=gold
ANTECIPEAI_VOLUME_RAW=raw

# --- Tipo de armazenamento das tabelas/volumes ---
# MANAGED  = storage gerenciado pelo próprio metastore do Databricks (default do
#            Databricks Free). Usar nesta fase do projeto acadêmico (custo zero).
# EXTERNAL = aponta para um storage externo já existente (bucket S3, container
#            ADLS, bucket GCS, bucket OCI...). Usar quando o projeto for
#            aprovado e migrar para produção.
ANTECIPEAI_TABLE_TYPE=MANAGED

# --- Storage root (obrigatório somente se ANTECIPEAI_TABLE_TYPE=EXTERNAL) ---
# Precisa ser um External Location já configurado no Unity Catalog, com as
# credenciais de storage credential correspondentes já criadas pelo admin do
# workspace. Exemplos de formato esperado por provedor:
#   AWS:   s3://antecipeai-datalake/prod/
#   Azure: abfss://[email protected]/prod/
#   GCP:   gs://antecipeai-datalake/prod/
#   OCI:   oci://[email protected]/prod/
ANTECIPEAI_STORAGE_ROOT=

# --- Provedor de nuvem alvo (apenas informativo/log, não usado em lógica) ---
# Valores aceitos: NONE | AWS | AZURE | GCP | OCI
ANTECIPEAI_CLOUD_PROVIDER=NONE

# --- Cluster / compute ---
# Usado só como documentação do que foi usado nesta fase, não é lido pelos
# notebooks (o compute é escolhido na UI do Databricks, não via .env).
ANTECIPEAI_COMPUTE_MODE=SERVERLESS_FREE